<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco e Miriam sposi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Josefin+Sans:wght@300;400;600&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* Layout: una partecipazione disegnata a mano. Carta avorio, blu cobalto a tratto, senape, rosa e corallo; nomi in corsivo, testi spaziati, scheda ad arco e retro blu con cornice. */
:root{
  --bg:#f2efe9; --surface:#fbf9f4; --cobalt:#1f4a9c; --ink:#1b3c80; --soft:#4a639d; --faint:#7f90b8; --line:#d3dbec;
  --mustard:#d9a521; --pink:#eeb4bf; --coral:#c64b3c;
  --olive:var(--cobalt); --olive-deep:var(--cobalt); --leaf:#eef1f8; --passion:var(--coral); --sun:var(--mustard);
  --glow:var(--mustard); --night:#fff; --sage:var(--cobalt); --bad:#c64b3c; --edge:var(--line);
  --script:"Allura","Snell Roundhand","Brush Script MT",cursive;
  --hand:"Reenie Beanie","Bradley Hand","Segoe Print",cursive;
  --display:var(--script);
  --body:"Josefin Sans","Century Gothic","Avenir Next",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.6;background:var(--bg);-webkit-text-size-adjust:100%}
.bg{display:none}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:20px}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 30px -18px rgba(27,60,128,.35)}
nav.top{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(251,249,244,.96)}
nav.top .mono{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;font-family:var(--script);font-size:20px;line-height:1;padding-top:3px}
nav.top .tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.top .tabs::-webkit-scrollbar{display:none}
nav.top button{background:none;border:0;border-radius:999px;padding:10px 12px 7px;font-size:13.5px;font-weight:400;letter-spacing:.1em;text-transform:lowercase;color:var(--soft);white-space:nowrap;flex:0 0 auto}
nav.top button:hover{background:var(--leaf)}
nav.top button[aria-current="page"]{background:var(--cobalt);color:#fff}
.page{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--hand);font-size:26px;line-height:1;color:var(--cobalt);transform:rotate(-2deg);align-self:flex-start}
h1,h2{font-family:var(--script);font-weight:400;line-height:1;margin:0;text-wrap:balance;color:var(--cobalt)}
h1{font-size:clamp(64px,19vw,116px)}
h2{font-size:clamp(42px,10vw,58px)}
h3{font-family:var(--body);font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:lowercase;line-height:1.3;margin:0;color:var(--cobalt)}
p{margin:0}
.lead{color:var(--soft);font-size:17px;max-width:56ch;white-space:pre-line}
.hero{position:relative;overflow:hidden;padding:64px 22px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;border-radius:min(50vw,380px) min(50vw,380px) 22px 22px}
.hero .eyebrow{align-self:center;font-size:34px}
.hero .lead{letter-spacing:.04em}
.hero .when{justify-content:center}
.hero .scene{margin:10px -22px 0;width:calc(100% + 44px)}
.hero.photo{background-size:cover;background-position:center;min-height:520px;justify-content:flex-end;padding-bottom:28px;color:#fff}
.hero.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,40,90,.05),rgba(20,40,90,.8))}
.hero.photo h1,.hero.photo .lead,.hero.photo .eyebrow{color:#fff}
.hero.photo .chip{background:rgba(255,255,255,.94)}
.hero.photo .scene{display:none}
.hero>*{position:relative}
.hero h1 em{font-style:normal;color:var(--mustard)}
.scene{display:block;width:100%;height:auto}
.scene.foot{max-width:520px;opacity:.95}
.when{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--cobalt);border-radius:999px;padding:8px 14px 5px;font-size:13px;letter-spacing:.14em;text-transform:lowercase;color:var(--cobalt);background:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mustard);margin-top:-3px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count div{padding:14px 4px 10px;text-align:center}
.count b{display:block;font-size:32px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;color:var(--cobalt)}
.count span{font-size:11.5px;color:var(--faint);letter-spacing:.16em;text-transform:lowercase}
/* retro blu con cornice */
.fun,.wip{position:relative;background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.fun::after,.wip::after{content:"";position:absolute;inset:9px;border:1.5px solid rgba(255,255,255,.85);border-radius:13px;box-shadow:inset 0 0 0 3px var(--cobalt),inset 0 0 0 4.5px rgba(255,255,255,.85);pointer-events:none}
.fun>*,.wip>*{position:relative;z-index:1}
.fun{padding:30px 28px;display:flex;flex-direction:column;gap:10px}
.fun .eyebrow,.wip .eyebrow{color:var(--mustard)}
.fun p{font-size:19px;line-height:1.5;letter-spacing:.03em}
.wip{padding:34px 28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.wip h2,.wip .lead{color:#fff}
.wip .note{color:rgba(255,255,255,.78)}
.wip .stamp{border:2px dashed var(--mustard);color:var(--mustard);border-radius:10px;padding:6px 12px 3px;letter-spacing:.16em;text-transform:lowercase;font-size:13px;transform:rotate(-3deg)}
.bar{width:100%;height:14px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.bar span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--mustard) 0 10px,#e9c261 10px 20px);border-radius:999px}
.answer{font-family:var(--hand);font-size:30px;line-height:1.1;min-height:1.2em;color:var(--mustard)}
.btn{align-self:flex-start;background:transparent;border:1px solid var(--cobalt);border-radius:999px;padding:10px 16px 7px;font-size:13px;letter-spacing:.14em;text-transform:lowercase;color:var(--cobalt)}
.btn:hover{background:var(--leaf)}
.btn.solid{background:var(--cobalt);color:#fff}
.fun .btn,.wip .btn{background:#fff;border-color:#fff;color:var(--cobalt)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.door{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px 18px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.door:hover{border-color:var(--cobalt)}
.door span{color:var(--soft);font-size:15.5px}
.door b{font-family:var(--hand);font-size:24px;font-weight:400;line-height:1;color:var(--coral)}
.head{padding:26px 22px;display:flex;flex-direction:column;gap:10px}
.plain{padding:8px 4px 0;display:flex;flex-direction:column;gap:8px}
.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.figures div{padding:16px 8px 12px;text-align:center}
.figures b{display:block;font-family:var(--script);font-weight:400;font-size:58px;line-height:1;color:var(--mustard)}
.figures span{font-size:12.5px;letter-spacing:.12em;text-transform:lowercase;color:var(--soft)}
.road{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:26px}
.road::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(180deg,var(--cobalt) 0 5px,transparent 5px 11px);opacity:.45}
.stop{position:relative;padding:18px 18px 16px;display:flex;flex-direction:column;gap:5px}
.stop::before{content:"";position:absolute;left:-24px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cobalt)}
.stop.last::before{background:var(--mustard);border-color:var(--mustard)}
.stop .where,.tag{font-size:12px;letter-spacing:.16em;text-transform:lowercase;color:var(--coral)}
.stop p,.cards p,.way p{color:var(--soft);font-size:16px;white-space:pre-line}
.photo-in{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:8px;display:block}
.girls,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.girls .glass,.cards .glass{padding:20px 18px 18px;display:flex;flex-direction:column;gap:6px}
.girls .date{font-family:var(--script);font-size:42px;line-height:1;color:var(--mustard)}
.timeline{display:flex;flex-direction:column;gap:10px}
.moment{display:grid;grid-template-columns:54px 22px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:17px 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.moment:hover{border-color:var(--cobalt)}
.moment .t{font-size:15px;letter-spacing:.06em;color:var(--cobalt);font-variant-numeric:tabular-nums}
.moment .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--cobalt);background:var(--surface);justify-self:center;margin-top:-3px}
.moment .n{font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:lowercase;display:block;color:var(--cobalt)}
.moment .s{display:block;font-size:14px;color:var(--faint)}
.moment .more{display:block;font-size:15.5px;color:var(--soft);margin-top:8px;max-width:48ch;white-space:pre-line}
.moment .more[hidden]{display:none}
.moment .a{color:var(--faint);font-size:18px;transition:transform .2s}
.moment[aria-expanded="true"] .a{transform:rotate(90deg)}
.moment.done .d{background:var(--cobalt)}
.moment.now{border-color:var(--cobalt);background:var(--leaf)}
.moment.now .d{background:var(--mustard);border-color:var(--mustard);box-shadow:0 0 0 5px rgba(217,165,33,.2)}
.pill{background:var(--mustard);color:#1b3c80;border-radius:999px;padding:6px 12px 3px;font-size:12.5px;letter-spacing:.12em;text-transform:lowercase}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--cobalt);color:#fff;border:0;border-radius:16px;padding:17px 18px 14px;letter-spacing:.1em;text-transform:lowercase;font-size:15px;text-decoration:none}
.cta.ghost{background:transparent;color:var(--cobalt);border:1px solid var(--cobalt)}
.note{font-size:14px;color:var(--faint);letter-spacing:.03em}
.ways{display:flex;flex-direction:column;gap:10px}
.way{padding:18px;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.way svg{width:44px;height:44px;padding:10px;border-radius:50%;border:1px solid var(--cobalt);stroke:var(--cobalt);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lock{padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.lock form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lock input{flex:1;min-width:180px;background:#fff;border:1px solid var(--cobalt);border-radius:14px;padding:13px 14px 10px;min-height:48px}
.lock form .btn{align-self:center}
.err{color:var(--bad);font-size:15px}
footer{text-align:center;color:var(--faint);font-size:13px;letter-spacing:.14em;text-transform:lowercase;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:16px;right:16px;bottom:18px;margin:0 auto;max-width:380px;background:var(--cobalt);color:#fff;padding:11px 14px 8px;border-radius:12px;text-align:center;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
/* editor */
dialog#ed{border:0;padding:0;margin:0 0 0 auto;width:min(460px,100%);max-width:100%;height:100%;max-height:100%;background:#f7f5ef;color:#222b24;color-scheme:light}
dialog#ed::backdrop{background:rgba(0,0,0,.35)}
.ed-top{position:sticky;top:0;background:#f7f5ef;border-bottom:1px solid #d9d6cb;padding:12px 14px;display:flex;flex-direction:column;gap:8px;z-index:2}
.ed-top h2{font-family:var(--body);font-size:18px;font-weight:700}
.ed-row{display:flex;gap:6px;flex-wrap:wrap}
.ed-b{background:#fff;border:1px solid #c9c5b8;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;color:#222b24}
.ed-b.go{background:#3d5a34;border-color:#3d5a34;color:#fff}
.ed-b.del{color:#a33}
#edBody{padding:10px 14px 40px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
#edBody details{background:#fff;border:1px solid #d9d6cb;border-radius:12px;padding:0 12px}
#edBody summary{font-weight:700;padding:12px 0;cursor:pointer}
#edBody label{display:block;font-size:13px;font-weight:600;color:#56604f;margin:8px 0 3px}
#edBody input[type=text],#edBody input[type=password],#edBody textarea{width:100%;border:1px solid #c9c5b8;border-radius:8px;padding:8px 10px;background:#fbfaf6;color:#222b24}
#edBody textarea{min-height:76px;resize:vertical}
#edBody fieldset{border:1px solid #d9d6cb;border-radius:10px;margin:8px 0;padding:6px 10px 10px}
#edBody legend{font-size:12.5px;font-weight:700;color:#56604f;padding:0 4px}
#edBody .thumb{max-width:120px;max-height:80px;border-radius:6px;display:block;margin:4px 0}
#edBody .help{font-size:13px;color:#56604f;margin:6px 0 10px}
@media (max-width:600px){nav.top{border-radius:24px;align-items:flex-start}nav.top .tabs{flex-wrap:wrap;overflow:visible;row-gap:2px}nav.top button{padding:8px 11px;font-size:13.5px}}
@media (max-width:420px){.moment{grid-template-columns:50px 22px 1fr auto;padding:14px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- cifratura dell'area riservata ---------- */
function b64(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function keyFrom(pw,salt){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);});
}
function encrypt(pw,obj){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return keyFrom(pw,salt).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)));})
    .then(function(ct){return {s:b64(salt),i:b64(iv),c:b64(ct)};});
}
function decrypt(pw,box){
  try{return keyFrom(pw,unb64(box.s)).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.i)},k,unb64(box.c));})
    .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});}catch(e){return Promise.reject(e);}
}

function getP(path){return path.split(".").reduce(function(o,k){return o==null?o:o[k];},C);}

var rT;function changed(){clearTimeout(rT);rT=setTimeout(render,250);}
var uid=0;
function field(path,label,type){

  if(type==="chk"){var c=h("input",{type:"checkbox",id:id});c.checked=!!v;c.addEventListener("change",function(){setP(path,c.checked);changed();});return h("label",{for:id},[c," "+label]);}

      box.appendChild(fi);
      if(cur)box.appendChild(h("button",{type:"button",class:"ed-b del",text:"Togli la foto",onclick:function(){setP(path,"");draw();changed();}}));};

}
function shrink(file,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    cb(cv.toDataURL("image/jpeg",0.74));};im.onerror=function(){toast("Non riesco a leggere questa immagine.");};im.src=r.result;};
  r.readAsDataURL(file);
